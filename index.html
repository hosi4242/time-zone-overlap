<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Find practical working-hour overlaps across time zones, with DST-aware timelines and calendar export.">
  <meta name="theme-color" content="#f7f8fb">
  <title>Time Zone Overlap Finder</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">Skip to main content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Time Zone Overlap Finder home" data-i18n="brand">Time Zone Overlap Finder</a>
      <div class="header-actions">
        <button id="language-toggle" class="icon-button language-button" type="button" aria-label="Switch to Korean" title="Switch to Korean">한국어</button>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle color theme" title="Toggle color theme">Theme</button>
      </div>
    </div>
  </header>

  <main id="main" class="page-shell">
    <section class="hero" aria-labelledby="page-title">
      <h1 id="page-title" data-i18n="heroTitle">Find a time that works for everyone.</h1>
    </section>

    <section class="panel controls-panel" aria-labelledby="settings-title">
      <div class="section-heading">
        <div><h2 id="settings-title" data-i18n="meetingSettings">Meeting settings</h2></div>
        <button id="reset-button" class="text-button" type="button" data-i18n="reset">Reset</button>
      </div>

      <div id="city-list" class="city-list"></div>

      <div class="settings-grid">
        <div class="field-group">
          <label for="date-input" data-i18n="date">Date</label>
          <input id="date-input" type="date">
          <p id="date-note" class="field-note" aria-live="polite"></p>
        </div>
        <fieldset class="field-group format-fieldset">
          <legend data-i18n="timeFormat">Time format</legend>
          <div class="segmented" role="group" aria-label="Time format" data-i18n-aria="timeFormat">
            <button type="button" class="segment" data-format="24" aria-pressed="true" data-i18n="hour24">24-hour</button>
            <button type="button" class="segment" data-format="12" aria-pressed="false" data-i18n="hour12">12-hour</button>
          </div>
        </fieldset>
        <fieldset class="field-group meeting-fieldset">
          <legend data-i18n="meetingLength">Meeting length</legend>
          <div class="segmented" role="group" aria-label="Meeting length" data-i18n-aria="meetingLength">
            <button type="button" class="segment" data-length="30" aria-pressed="false" data-i18n="min30">30 min</button>
            <button type="button" class="segment" data-length="60" aria-pressed="true" data-i18n="min60">60 min</button>
            <button type="button" class="segment" data-length="90" aria-pressed="false" data-i18n="min90">90 min</button>
          </div>
        </fieldset>
      </div>
    </section>

    <section class="notice-stack" id="notice-stack" aria-live="polite"></section>

    <section class="panel timeline-panel combined-panel" aria-labelledby="result-title">
      <div class="section-heading result-heading">
        <div><h2 id="result-title" data-i18n="bestMeetingTime">Best overlap time</h2></div>
      </div>
      <div id="recommendation" class="recommendation"></div>
      <div id="summary-live" class="sr-live" aria-live="polite" aria-atomic="true"></div>
<div class="action-row">
        <button id="copy-result" class="primary-button" type="button" data-i18n="copyResult">Copy result</button>
        <button id="copy-link" class="secondary-button" type="button" data-i18n="copyLink">Copy link</button>
      </div>
      <p id="action-status" class="action-status" aria-live="polite"></p>
    
      <div class="section-heading timeline-heading">
        <div><h2 id="timeline-title" data-i18n="timelineTitle">Overlap timeline</h2></div>
      </div>
      <div id="timeline" class="timeline" aria-label="Overlap timeline"></div>
      <details class="table-details">
        <summary data-i18n="viewTable">View as table</summary>
        <div class="table-scroll">
          <table id="overlap-table">
            <caption data-i18n="tableCaption">Overlap ranges and each city's local time</caption>
            <thead><tr><th scope="col" data-i18n="overlap">Overlap</th><th scope="col" data-i18n="localTimes">Local times</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </details>
    </section>
/main>


  <script src="/assets/engine.js" defer></script>
  <script src="/assets/cities.js" defer></script>
  <script src="/assets/app.js" defer></script>
</body>
</html>
